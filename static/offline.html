<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Hors ligne — Bet With Friend</title>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #6d28d9;
				color: #ffffff;
				font-family:
					ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
					Helvetica, Arial, sans-serif;
				padding:
					calc(env(safe-area-inset-top) + 1rem)
					calc(env(safe-area-inset-right) + 1rem)
					calc(env(safe-area-inset-bottom) + 1rem)
					calc(env(safe-area-inset-left) + 1rem);
			}
			.card {
				text-align: center;
				max-width: 28rem;
			}
			.dice {
				font-size: 4rem;
				line-height: 1;
			}
			h1 {
				font-size: 1.5rem;
				margin: 1rem 0 0.5rem;
			}
			p {
				opacity: 0.9;
				line-height: 1.5;
			}
			.retry {
				display: inline-block;
				margin-top: 1.5rem;
				padding: 0.6rem 1.2rem;
				border-radius: 0.5rem;
				background: #ffffff;
				color: #6d28d9;
				text-decoration: none;
				font-weight: 600;
			}
		</style>
	</head>
	<body>
		<div class="card">
			<div class="dice">🎲</div>
			<h1>Vous êtes hors ligne</h1>
			<p>
				Bet With Friend a besoin d'une connexion pour fonctionner. Vérifiez votre réseau puis
				réessayez.
			</p>
			<a class="retry" href="/">Réessayer</a>
		</div>
	</body>
</html>
